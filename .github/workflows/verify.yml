name: Verify educational engine
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node tools/test.js
      - run: python src/build.py --check
      - run: python tools/check_package.py
